[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:redis]
command=redis-server
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fastapi]
command=sh -c './check_env.sh && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 7860'
redirect_stderr=true
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
directory=/app

[program:worker]
command=sh -c './check_env.sh && exec python -m celery -A app.worker.tasks worker --loglevel=info'
redirect_stderr=true
priority=20
startsecs=5
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
directory=/app

[program:beat]
command=sh -c './check_env.sh && exec python -m celery -A app.worker.tasks beat --loglevel=info'
redirect_stderr=true
priority=30
startsecs=5
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
directory=/app