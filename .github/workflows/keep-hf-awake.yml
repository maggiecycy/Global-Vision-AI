name: Keep HF Space Awake

on:
  schedule:
    # 每天 UTC 06:00、18:00（北京时间 14:00、02:00）各 ping 一次，确保 48h 内必有流量
    - cron: "0 6,18 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake HF Backend
        env:
          # 可在 Repo Settings > Secrets and variables > Actions 中设置 HF_SPACE_URL 覆盖
          HF_URL: ${{ vars.HF_SPACE_URL }}
        run: |
          URL="${HF_URL:-https://maggiecycy-global-vision-backend.hf.space}"
          echo "Pinging $URL ..."
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$URL/" || true
